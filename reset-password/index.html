<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting to tvusage Reset Password</title>
    <script>
        // Redirect to web app with all URL parameters preserved
        const params = window.location.search;
        window.location.replace('https://remote.tvusage.app/reset-password' + params);
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; URL=https://remote.tvusage.app/reset-password">
    </noscript>
</head>

<body>
    <p>Redirecting to tvusage...</p>
</body>

</html>
